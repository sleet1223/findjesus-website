:root{
  --ink:#1d1912;
  --ink-soft:#554d41;
  --ink-faint:#70675a;
  --gold:#c5a34a;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:#f3f7fc;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
::selection{background:#f1e2b4;color:var(--ink)}

/* ---------- Sky ---------- */
/* The gradient below is the whole background if WebGL is unavailable; the live sky fades in over it. */
.sky{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(58% 46% at 50% 40%,#fff 0%,rgba(255,255,255,.92) 38%,rgba(255,255,255,0) 72%),
    radial-gradient(90% 55% at 50% 108%,#fff 0%,rgba(255,255,255,.9) 45%,rgba(255,255,255,0) 78%),
    radial-gradient(70% 50% at 50% 34%,rgba(255,238,204,.55),rgba(255,238,204,0) 70%),
    linear-gradient(180deg,#c9def5 0%,#e4effb 42%,#fbf6ee 100%)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.4s ease}
.sky canvas.is-live{opacity:1}

/* ---------- Layout ---------- */
.page{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;
  padding:max(32px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.stage{align-self:center;justify-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:100%;padding:24px 0 40px}

h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(60px,19.6vw,max(176px,9.2vw));line-height:.92;letter-spacing:-.028em;white-space:nowrap;
  font-kerning:normal;font-feature-settings:"kern","liga";
  text-shadow:0 0 .5em rgba(255,255,255,.95),0 0 .12em rgba(255,255,255,.75)}
.lede{margin:clamp(20px,2.6vh,28px) 0 0;max-width:50ch;font-size:clamp(16px,1.22vw,19px);line-height:1.6;letter-spacing:-.006em;color:var(--ink-soft);text-wrap:balance;
  text-shadow:0 0 18px rgba(255,255,255,.9)}
.lede span{display:block;text-wrap:balance}

/* ---------- App Store badge (official Apple artwork, unmodified) ---------- */
.cta{margin-top:clamp(32px,4.4vh,44px);line-height:0}
.badge{position:relative;display:inline-block;border-radius:12px;line-height:0;
  -webkit-tap-highlight-color:transparent;transition:transform .5s var(--ease)}
.badge svg{display:block;height:clamp(54px,4.4vw,62px);width:auto;
  filter:drop-shadow(0 1px 1px rgba(29,25,18,.25)) drop-shadow(0 10px 22px rgba(29,25,18,.20));
  transition:filter .5s var(--ease)}
.badge::before{content:"";position:absolute;z-index:-1;inset:-34px -46px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,228,160,.95),rgba(255,236,190,.42) 55%,rgba(255,236,190,0));
  filter:blur(8px);opacity:.35;transform:scale(.92);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.badge:hover,.badge:focus-visible{transform:translateY(-2px)}
.badge:hover svg,.badge:focus-visible svg{filter:drop-shadow(0 1px 1px rgba(29,25,18,.25)) drop-shadow(0 14px 28px rgba(140,104,30,.30))}
.badge:hover::before,.badge:focus-visible::before{opacity:1;transform:scale(1.06)}
.badge:active{transform:translateY(0) scale(.985);transition-duration:.12s}
.note span{display:inline-block}
.note{margin:16px 0 0;font-size:13px;line-height:1.5;letter-spacing:.002em;color:var(--ink-faint);text-shadow:0 0 14px rgba(255,255,255,.9)}

footer{justify-self:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:28px;row-gap:0;
  font-size:12.5px;line-height:1.5;color:var(--ink-faint);text-shadow:0 0 14px rgba(255,255,255,.95)}
footer p{margin:0;padding:10px 0}
footer nav{display:flex;gap:24px}
footer a{display:inline-block;padding:10px 2px;color:inherit;text-decoration:none;background:linear-gradient(currentColor,currentColor) 2px calc(100% - 9px)/0 1px no-repeat;
  transition:color .3s,background-size .45s var(--ease)}
footer a:hover,footer a:focus-visible{color:var(--ink);background-size:calc(100% - 4px) 1px}
a:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
.badge:focus-visible{outline-offset:8px}

/* ---------- One arrival: the sky clears, then the words settle ---------- */
.rise{animation:rise 1.5s var(--ease) both;animation-delay:calc(.55s + var(--i,0)*.16s)}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}

@media (max-width:600px){
  .stage{padding:8px 0 32px}
  .lede{max-width:27ch}
  footer{column-gap:20px;font-size:12px}
  footer nav{gap:20px}
}
@media (max-height:560px) and (min-width:601px){
  .page{padding-top:20px;padding-bottom:12px}
  h1{font-size:clamp(56px,20vh,120px)}
  .stage{padding:4px 0 8px}
  .lede{margin-top:12px;font-size:15px}
  .cta{margin-top:20px}
  .badge svg{height:48px}
  .note{margin-top:12px}
  footer p,footer a{padding-top:6px;padding-bottom:6px}
}
@media (min-width:2200px){
  .lede{font-size:23px}
  .badge svg{height:74px}
  .note{font-size:15.5px;margin-top:20px}
  footer{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){
  .rise{animation:none}
  .sky canvas{transition:none}
  .badge,.badge svg,.badge::before,footer a{transition:none}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"><canvas id="sky"></canvas></div>

<div class="page">
  <main class="stage" id="stage">
    <h1 class="rise" style="--i:0">Find Jesus.</h1>
    <p class="lede rise" style="--i:1"><span>He’s hidden ten times in a new scene every day.</span> <span>Find Him, and today’s prayer opens.</span></p>

    <!-- App Store link: change the href below if the app ID changes. -->

<script id="sky-frag" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;      // canvas size in pixels
uniform float uTime;     // seconds
uniform vec2  uLight;    // the light (follows the pointer quickly)
uniform vec2  uTail;     // where the light was a moment ago (follows slowly) -> leaves a wake
uniform vec2  uPar;      // pointer parallax, -1..1
uniform vec4  uStage;    // xy: centre of the text block, zw: its half-size (all in sky units)
uniform float uIntro;    // 0 -> 1 as the page arrives
uniform float uEnergy;   // 0 -> 1 while the App Store badge is hovered / focused
uniform float uPresence; // 0 when the light rests at home, 1 when it follows a pointer

// ---- noise -------------------------------------------------------------
vec2 hash22(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy) * 2.0 - 1.0;
}
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * .1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float gnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);
  float a = dot(hash22(i),               f);
  float b = dot(hash22(i + vec2(1., 0.)), f - vec2(1., 0.));
  float c = dot(hash22(i + vec2(0., 1.)), f - vec2(0., 1.));
  float d = dot(hash22(i + vec2(1., 1.)), f - vec2(1., 1.));
  return 0.5 + 0.72 * mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
const mat2 ROT = mat2(1.6, 1.2, -1.2, 1.6);
float fbm3(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){ v += a * gnoise(p); p = ROT * p; a *= 0.5; }
  return v / 0.875;
}
float fbm4(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ v += a * gnoise(p); p = ROT * p; a *= 0.5; }
  return v / 0.9375;
}
// cellular noise: 1 at cell centres, falling away -> the rounded "puffs" of cumulus
float worley(vec2 p){
  vec2 i = floor(p), f = fract(p);
  float md = 1.0;
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++){
    vec2 g = vec2(float(x), float(y));
    vec2 r = g + (hash22(i + g) * 0.5 + 0.5) - f;
    md = min(md, dot(r, r));
  }
  return 1.0 - sqrt(md);
}
// cheaper variant for the small octaves: only the four nearest cells
float worley4(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 s = step(0.5, f) * 2.0 - 1.0;
  float md = 1.0;
  for (int y = 0; y <= 1; y++)
  for (int x = 0; x <= 1; x++){
    vec2 g = vec2(float(x), float(y)) * s;
    vec2 r = g + (hash22(i + g) * 0.5 + 0.5) - f;
    md = min(md, dot(r, r));
  }
  return 1.0 - sqrt(min(md, 1.0));
}

float segDist(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);
  return length(pa - ba * h);
}

// cumulus: broad soft masses (gradient noise) eroded by rounded puffs (cellular noise).
// returns x: density, y: puff value (its valleys are the creases between billows), z: the broad mass alone
vec3 cumulus(vec2 q, vec2 w){
  float mass = fbm4(q * 0.9 + w);
  float puff = worley(q * 1.6 + w * 0.6) * 0.50
             + worley4(q * 3.3 + w * 0.6 + 7.1) * 0.26
             + worley4(q * 6.7 + 3.3) * 0.15
             + worley4(q * 13.7 + 1.9) * 0.09;
  float er = (1.0 - puff) * 0.56;
  float n  = (mass - er) / (1.0 - er) + (gnoise(q * 31.0) - 0.5) * 0.018;
  return vec3(n, puff, mass);
}
float cumulusFar(vec2 q){
  float mass = fbm3(q * 0.9);
  float puff = worley(q * 1.6) * 0.56 + worley4(q * 3.3 + 7.1) * 0.27 + worley4(q * 6.7 + 3.3) * 0.17;
  float er = (1.0 - puff) * 0.56;
  return (mass - er) / (1.0 - er);
}

void main(){
  vec2  frag = gl_FragCoord.xy;
  float m    = min(uRes.x, uRes.y);
  vec2  p    = (frag - 0.5 * uRes) / m;      // short side spans -0.5 .. 0.5
  vec2  v    = frag / uRes;                   // 0..1
  float t    = uTime;
  float intro = smoothstep(0.0, 1.0, uIntro);

  // how far this pixel is from the text block (0 at its centre, ~1 around its edge)
  vec2  sr = uStage.zw + vec2(0.07, 0.06);
  float e  = length((p - uStage.xy) / sr);
  float open = (1.0 - smoothstep(0.78, 1.55, e)) * intro;   // the clearing that frames the words

  // the pointer's wake: a capsule between where the light is and where it was
  float wd   = segDist(p, uLight, uTail);
  float wake = exp(-wd * wd / 0.024) * uPresence;
  float dl   = length(p - uLight);
  float near = exp(-dl * dl * 1.7);
  vec2  ld   = uLight - p;
  vec2  ln   = ld / max(length(ld), 1e-3);

  // ---- sky ---------------------------------------------------------------
  vec3 skyTop = vec3(0.560, 0.735, 0.950);
  vec3 skyMid = vec3(0.800, 0.890, 0.985);
  vec3 skyLow = vec3(0.985, 0.970, 0.945);
  vec3 col = mix(skyLow, skyMid, smoothstep(0.05, 0.55, v.y));
  col = mix(col, skyTop, smoothstep(0.45, 1.10, v.y));

  // the light itself: wide warm bloom + bright heart
  vec3  warm  = vec3(1.0, 0.925, 0.765);
  float bloom = exp(-dl * dl * 2.0) * (0.80 + 0.12 * uEnergy)
              + exp(-dl * dl * 11.0) * (0.85 + 0.15 * uEnergy);
  col = 1.0 - (1.0 - col) * (1.0 - warm * bloom);
  // a champagne halo around the white heart, so it reads as light rather than haze
  float halo = exp(-dl * dl * 2.6) * (1.0 - exp(-dl * dl * 10.0));
  col = mix(col, vec3(1.0, 0.968, 0.880), halo * (0.38 + 0.10 * uEnergy));

  // the clearing itself always holds a soft white glow, wherever the light wanders
  float hd = length((p - uStage.xy) / (sr * 1.15));
  col = mix(col, vec3(1.0, 0.995, 0.985), exp(-hd * hd * 1.15) * 0.80 * intro);

  // ---- far clouds: smaller, paler, slower ---------------------------------
  {
    vec2 q = p * 3.0 + uPar * 0.012 + vec2(t * 0.0060, 0.0) + 11.7;
    float cov = mix(0.34, 0.60, open) - (1.0 - intro) * 0.2;
    float n  = cumulusFar(q);
    float nu = cumulusFar(q + vec2(0.0, 0.05));
    float th = clamp((n - cov) / 0.20, 0.0, 1.0);
    float d  = smoothstep(0.0, 0.6, th);
    float up = clamp((n - nu) * 4.0, -1.0, 1.0);
    vec3 c = mix(vec3(0.780, 0.850, 0.965), vec3(0.975, 0.985, 1.0), clamp(0.74 + up * 0.45 - th * 0.10, 0.0, 1.0));
    c = mix(c, vec3(1.0, 0.985, 0.95), near * 0.5);
    col = mix(col, c, d * 0.82);
  }

  // ---- main clouds: lit by the light you carry ---------------------------
  {
    vec2 q = p * 1.55 + uPar * 0.030 + vec2(t * 0.0105, t * 0.0012);
    vec2 w = (vec2(fbm3(q * 0.5 + vec2(0.0, t * 0.004)), fbm3(q * 0.5 + vec2(5.2, 1.3) - vec2(t * 0.003, 0.0))) - 0.5) * 0.5;

    float cov = mix(0.235, 0.60, open);
    cov -= smoothstep(-0.12, -0.60, p.y) * 0.06 * (1.0 - open);   // the floor gathers
    cov += wake * 0.30;                                            // clouds part around the pointer
    cov -= (1.0 - intro) * 0.25;
    const float SOFT = 0.13;
    const float H = 0.018;

    vec3  c0 = cumulus(q, w);
    float n  = c0.x;
    float nx = cumulus(q + vec2(H, 0.0), w).x;
    float ny = cumulus(q + vec2(0.0, H), w).x;
    vec2  g  = vec2(nx - n, ny - n) / H;                           // slope of the cloud "surface"
    float massL = fbm4((q + ln * 0.17) * 0.9 + w);                 // the broad form, a step toward the light

    float th   = clamp((n - cov) / SOFT, 0.0, 1.0);                // 0 at a cloud's edge -> 1 inside
    float d    = smoothstep(0.0, 0.6, th);
    float deep = clamp((n - cov) / 0.5, 0.0, 1.0);                 // how far into the body

    float toLight = clamp(-dot(g, ln) * 0.16, -1.0, 1.0);          // small billows facing the light
    float toSky   = clamp(-g.y * 0.16, -1.0, 1.0);                 // ...and facing up
    float broad   = clamp((c0.z - massL) * 3.2, -1.0, 1.0);        // whole cloud bodies turning toward it
    float crease  = smoothstep(0.55, 0.25, c0.y) * deep;           // valleys between billows

    float shade = 0.84 + (toLight * mix(0.5, 1.0, near) + toSky * 0.6) * 0.55 + broad * 0.20 - deep * 0.10 - crease * 0.22;
    shade = clamp(shade, 0.0, 1.0);
    shade = mix(shade, 1.0, (1.0 - smoothstep(0.0, 0.6, th)) * 0.5);  // thin edges stay luminous

    vec3 shadowC = vec3(0.700, 0.780, 0.930);                      // pearl blue
    vec3 shadowW = vec3(0.955, 0.925, 0.885);                      // rose-gold close to the light
    vec3 c = mix(mix(shadowC, shadowW, near * 0.8), vec3(1.0), smoothstep(0.0, 1.0, shade));

    // gold lining: thin cloud edges close to the light catch it
    float rim = smoothstep(0.0, 0.30, th) * (1.0 - smoothstep(0.30, 0.90, th));
    c += vec3(1.0, 0.80, 0.42) * rim * exp(-dl * dl * 4.5) * (0.30 + 0.22 * uEnergy);
    c = mix(c, c * vec3(1.0, 0.982, 0.945) + 0.012, near * 0.7);

    col = mix(col, c, d * 0.98);
  }

  // ---- near veil: soft out-of-focus cloud drifting past the edges --------
  {
    vec2 q = p * 0.60 + uPar * 0.075 + vec2(t * 0.021, -t * 0.003) + 31.4;
    float n = fbm3(q);
    float edge = smoothstep(1.15, 2.4, e);
    float d = smoothstep(0.50, 0.85, n) * edge * (1.0 - wake * 0.8);
    col = mix(col, vec3(1.0), d * 0.40);
  }

  // cloud floor: the very bottom of the frame dissolves into white
  col = mix(col, vec3(1.0), smoothstep(0.30, 0.0, v.y) * 0.92);

  // light scatters through everything near it
  float scat = exp(-dl * dl * 3.0) * (0.22 + 0.16 * uEnergy);
  col = 1.0 - (1.0 - col) * (1.0 - warm * scat);

  // arrival: the frame opens from pure white
  col = mix(vec3(1.0), col, intro);

  // dither away banding
  col += (hash12(frag) - 0.5) / 255.0;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('sky');
  const stage  = document.getElementById('stage');
  const badge  = document.getElementById('badge');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false })
          || canvas.getContext('experimental-webgl');
  if (!gl) return;                                   // CSS sky stays; everything else still works
  const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  if (!hp || !hp.precision) return;                  // the noise needs high precision; very old GPUs keep the CSS sky

  const VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FRAG = document.getElementById('sky-frag').textContent;
  let prog, U = {};

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  function init(){
    const vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;
    prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(prog)); return false; }
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ['uRes','uTime','uLight','uTail','uPar','uStage','uIntro','uEnergy','uPresence'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
    return true;
  }
  if (!init()) return;

  // ---- state ---------------------------------------------------------------
  let W = 1, H = 1, M = 1;                 // css size of the sky, and its short side
  let quality = 1, effective = 1;          // canvas pixels per css pixel; capped by a pixel budget, lowered if frames run long
  let time = 0, last = 0, prev = 0, raf = 0;
  let intro = reduce.matches ? 1 : 0;
  let energy = 0, energyTo = 0, presence = 0, presenceTo = 0;
  let lastPointer = -1e9, touchHome = 0;
  const home = [0, 0.1], target = [0, 0.1], light = [0, 0.1], tail = [0, 0.1], par = [0, 0], parTo = [0, 0];
  const stageBox = [0, 0, 0.5, 0.25];

  const toSky = (x, y) => [(x - W / 2) / M, -(y - H / 2) / M];

  function measure(){
    const box = canvas.parentElement.getBoundingClientRect();
    W = Math.max(1, box.width); H = Math.max(1, box.height); M = Math.min(W, H);
    const budget = 1.0e6;                                    // max canvas pixels: clouds are soft, so upscaling is invisible
    const q = effective = Math.min(quality, Math.sqrt(budget / (W * H)));
    const cw = Math.max(2, Math.round(W * q)), ch = Math.max(2, Math.round(H * q));
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; gl.viewport(0, 0, cw, ch); }

    const r = stage.getBoundingClientRect();
    const c = toSky(r.left + r.width / 2, r.top + r.height / 2);
    stageBox[0] = c[0]; stageBox[1] = c[1]; stageBox[2] = r.width / 2 / M; stageBox[3] = r.height / 2 / M;
    // the light rests just above the headline
    const h1 = stage.querySelector('h1').getBoundingClientRect();
    const hc = toSky(h1.left + h1.width / 2, h1.top + h1.height * 0.30);
    home[0] = hc[0]; home[1] = hc[1];
    if (reduce.matches) draw();
  }

  function draw(){
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, time);
    gl.uniform2f(U.uLight, light[0], light[1]);
    gl.uniform2f(U.uTail, tail[0], tail[1]);
    gl.uniform2f(U.uPar, par[0], par[1]);
    gl.uniform4f(U.uStage, stageBox[0], stageBox[1], stageBox[2], stageBox[3]);
    gl.uniform1f(U.uIntro, intro);
    gl.uniform1f(U.uEnergy, energy);
    gl.uniform1f(U.uPresence, presence);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!canvas.classList.contains('is-live')) canvas.classList.add('is-live');
  }

  // ---- adaptive quality: if the browser can't keep its frame rate, render fewer pixels ----
  let acc = 0, frames = 0;
  function watch(ms){
    acc += ms; frames++;
    if (frames < 12) return;
    const avg = acc / frames; acc = 0; frames = 0;
    if (avg > 24 && effective > 0.3){ quality = Math.max(0.3, effective * (avg > 50 ? 0.55 : 0.78)); measure(); }
  }

  function tick(now){
    raf = requestAnimationFrame(tick);
    const gap = prev ? now - prev : 16.7; prev = now;
    // 60fps while the light is being steered (also on 120Hz screens); 30fps is plenty for drifting cloud
    const idle = now - lastPointer > 2500 && intro >= 1 && Math.abs(energy - energyTo) < 0.01 && presence < 0.01;
    if (last && now - last < (idle ? 30 : 13)) return;
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
    last = now; time += dt;
    if (gap < 1000) watch(gap);
    if (intro < 1) intro = Math.min(1, intro + dt / 2.6);
    if (touchHome && now > touchHome){ touchHome = 0; presenceTo = 0; parTo[0] = parTo[1] = 0; }

    // at rest the light breathes slowly above the headline
    const hx = home[0] + Math.sin(time * 0.21) * 0.05, hy = home[1] + Math.cos(time * 0.17) * 0.025;
    presence += (presenceTo - presence) * (1 - Math.exp(-dt * 2.2));
    const tx = hx + (target[0] - hx) * presenceTo, ty = hy + (target[1] - hy) * presenceTo;
    const kf = 1 - Math.exp(-dt * 5.5), ks = 1 - Math.exp(-dt * 1.35), kp = 1 - Math.exp(-dt * 2.4); {
      light[0] += (tx - light[0]) * kf; light[1] += (ty - light[1]) * kf;
      tail[0]  += (light[0] - tail[0]) * ks; tail[1] += (light[1] - tail[1]) * ks;
    }
    par[0]   += (parTo[0] - par[0]) * kp;  par[1]  += (parTo[1] - par[1]) * kp;
    energy   += (energyTo - energy) * (1 - Math.exp(-dt * 3));
    draw();
  }

  function start(){
    cancelAnimationFrame(raf); raf = 0; last = 0; prev = 0; acc = 0; frames = 0;
    if (document.hidden) return;
    if (reduce.matches){ intro = 1; time = 24; presence = 0; light[0] = tail[0] = home[0]; light[1] = tail[1] = home[1]; draw(); return; }
    raf = requestAnimationFrame(tick);
  }

  // ---- pointer ---------------------------------------------------------------
  function steer(ev){
    if (reduce.matches) return;
    const s = toSky(ev.clientX, ev.clientY);
    target[0] = s[0]; target[1] = s[1];
    parTo[0] = Math.max(-1, Math.min(1, ev.clientX / W * 2 - 1));
    parTo[1] = Math.max(-1, Math.min(1, -(ev.clientY / H * 2 - 1)));
    presenceTo = 1; lastPointer = performance.now();
    touchHome = ev.pointerType === 'touch' ? lastPointer + 1600 : 0;
  }
  function release(){ presenceTo = 0; parTo[0] = parTo[1] = 0; lastPointer = performance.now(); }
  addEventListener('pointermove', steer, { passive: true });
  addEventListener('pointerdown', steer, { passive: true });
  document.documentElement.addEventListener('pointerleave', release);
  addEventListener('blur', release);

  const lift = () => { energyTo = 1; lastPointer = performance.now(); };
  const rest = () => { energyTo = 0; lastPointer = performance.now(); };
  badge.addEventListener('pointerenter', lift); badge.addEventListener('pointerleave', rest);
  badge.addEventListener('focus', lift);        badge.addEventListener('blur', rest);

  // ---- lifecycle ----------------------------------------------------------------
  addEventListener('resize', measure, { passive: true });
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  document.addEventListener('visibilitychange', start);
  reduce.addEventListener ? reduce.addEventListener('change', start) : reduce.addListener(start);
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); canvas.classList.remove('is-live'); });
  canvas.addEventListener('webglcontextrestored', () => { if (init()) { measure(); start(); } });

  measure();
  light[0] = tail[0] = home[0]; light[1] = tail[1] = home[1];
  start();
})();
</script>
</body>
