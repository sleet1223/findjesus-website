<html lang="en">

<style>
:root{color-scheme:dark;--bg:#151513;--ink:#f6f4ef;--soft:#a9a69c;--gold:#c5a34a;--serif:"Times New Roman",Times,serif;--ease:cubic-bezier(.22,1,.36,1);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);-webkit-font-smoothing:antialiased}a{color:inherit}::selection{background:#c5a34a;color:#151513}
.page{position:relative;isolation:isolate;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:32px clamp(24px,5vw,80px) 22px;overflow:hidden}
.page::before{content:"";position:absolute;z-index:-2;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(197,163,74,.065),transparent 56%);pointer-events:none;transition:opacity 1s;opacity:.7}
.page:has(.download:hover)::before,.page:has(.download:focus-visible)::before{opacity:1}
header{display:flex;align-items:center;justify-content:flex-start;position:relative;z-index:2}
.wordmark{display:flex;align-items:center;gap:11px;margin:0;font-size:17px;font-weight:500;letter-spacing:-.04em}.mark{width:23px;height:23px;color:var(--gold)}
main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 0 60px;min-width:0}
.orbit{position:absolute;z-index:-1;pointer-events:none;top:50%;left:50%;width:min(70vw,740px);aspect-ratio:1;transform:translate(-50%,-52%);border:1px solid rgba(197,163,74,.16);border-radius:50%;transition:transform 1.2s var(--ease),border-color 1.2s,box-shadow 1.2s;box-shadow:inset 0 0 100px rgba(197,163,74,.025)}
.orbit::before{content:"";position:absolute;inset:22px;border:1px solid rgba(197,163,74,.055);border-radius:50%;transition:inset 1.2s var(--ease)}
.orbit::after{content:"";position:absolute;left:50%;top:-2px;width:3px;height:3px;background:#c5a34a;border-radius:50%;box-shadow:0 0 12px rgba(197,163,74,.35)}
main:has(.download:hover) .orbit,main:has(.download:focus-visible) .orbit{transform:translate(-50%,-52%) scale(1.035);border-color:rgba(197,163,74,.33);box-shadow:inset 0 0 120px rgba(197,163,74,.045),0 0 90px rgba(197,163,74,.025)}
main:has(.download:hover) .orbit::before,main:has(.download:focus-visible) .orbit::before{inset:13px}
.kicker{font-size:11px;line-height:1.5;letter-spacing:.2em;text-transform:uppercase;font-weight:400;color:#b7b2a5;margin:0 0 28px;display:flex;align-items:center;gap:15px}.kicker::before,.kicker::after{content:"";width:24px;height:1px;background:rgba(197,163,74,.55)}
h1{font-size:clamp(72px,8.5vw,124px);line-height:.95;font-weight:400;letter-spacing:-.07em;margin:0;position:relative}h1 .first{display:block}h1 em{font-family:var(--serif);font-weight:400;letter-spacing:-.085em;color:#d6c69d}h1 .second{display:block;font-size:.73em;letter-spacing:-.065em;margin-top:12px;color:var(--ink)}
.subline{margin:28px 0 0;max-width:36ch;color:#b3b0a7;font-size:16px;font-weight:400;line-height:1.75;letter-spacing:-.015em;text-wrap:pretty}
.cta{margin-top:32px;max-width:100%}.download{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:24px;justify-content:center;text-decoration:none;border:1px solid #dac996;border-radius:999px;background:#f6f4ef;padding:18px 22px 18px 29px;color:#22221e;font-size:14px;line-height:1.4;font-weight:500;letter-spacing:-.015em;box-shadow:0 1px 0 rgba(255,255,255,.3),0 9px 30px rgba(0,0,0,.3);transition:transform .6s var(--ease),box-shadow .6s var(--ease),background .6s;animation:breathe 3s ease-in-out infinite}
.download .label{position:relative;display:block;overflow:hidden}.label span{display:block;transition:transform .6s var(--ease)}.label span:last-child{position:absolute;inset:0;transform:translateY(150%)}
.arrow{width:28px;height:28px;border-radius:50%;border:1px solid #d4cdbb;display:grid;place-items:center;transition:background .6s,border-color .6s,transform .6s var(--ease)}.arrow svg{width:12px;height:12px}
.download:hover,.download:focus-visible{animation:none;transform:translateY(-3px);background:#fffdf6;box-shadow:0 0 0 5px rgba(197,163,74,.045),0 0 45px rgba(197,163,74,.13),0 16px 40px rgba(0,0,0,.3)}.download:hover .label span:first-child,.download:focus-visible .label span:first-child{transform:translateY(-150%)}.download:hover .label span:last-child,.download:focus-visible .label span:last-child{transform:translateY(0)}.download:hover .arrow,.download:focus-visible .arrow{background:#e6d6a8;border-color:#d0b76e;transform:rotate(-45deg)}.download:active{transform:translateY(0) scale(.98)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:7px}.note{margin:16px 0 0;font-size:12px;line-height:1.6;color:#a9a69c}.note span{padding:0 8px;color:#9d906e}
footer{position:relative;font-size:12px;line-height:1.6;color:#a9a69c;text-align:center}footer p{margin:0}footer a{display:inline-block;padding:8px 2px;text-decoration:none;position:relative;transition:color .3s}footer a::after{content:"";height:1px;background:var(--gold);position:absolute;bottom:6px;left:2px;right:2px;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}footer a:hover{color:var(--ink)}footer a:hover::after,footer a:focus-visible::after{transform:scaleX(1)}footer .dot{padding:0 9px;color:#716b5e}
.reveal{animation:arrive .9s var(--ease) both;animation-delay:calc(var(--order,0)*120ms)}@keyframes arrive{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes breathe{0%,100%{box-shadow:0 1px 0 rgba(255,255,255,.3),0 9px 30px rgba(0,0,0,.3)}50%{box-shadow:0 1px 0 rgba(255,255,255,.3),0 0 24px rgba(197,163,74,.09),0 13px 36px rgba(0,0,0,.22)}}
@media(min-width:760px) and (max-height:820px){main{padding:30px 0}.orbit{width:min(70vw,calc(100svh - 40px))}h1{font-size:clamp(72px,11vh,104px)}.kicker{margin-bottom:22px}.subline{margin-top:24px}.cta{margin-top:26px}}
@media(max-width:759px){.page{padding:26px 22px 18px}main{padding:60px 0 64px}.wordmark{font-size:16px}.orbit{width:126vw;max-width:660px}.orbit::before{inset:14px}.kicker{font-size:10px;letter-spacing:.17em;margin-bottom:25px}h1{font-size:clamp(70px,14.5vw,108px)}.subline{font-size:16px;max-width:31ch;margin-top:26px}.cta{margin-top:28px}.download{gap:16px;padding:16px 17px 16px 23px;font-size:14px}.note{font-size:11px}footer{font-size:11px}footer .dot{padding:0 5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* The light stays behind the reading surface and never intercepts input. */
#atmosphere{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;opacity:.95;animation:light-arrive 2.4s ease both}
.page::before{z-index:-1;background:radial-gradient(ellipse at 50% 48%,rgba(21,21,19,.32) 0%,rgba(21,21,19,.06) 38%,rgba(10,10,9,.28) 100%);opacity:1}
.orbit{opacity:.28;border-color:rgba(197,163,74,.17);box-shadow:none}
.orbit::after{display:none}
h1{text-shadow:0 4px 50px rgba(0,0,0,.22)}
.download{overflow:hidden}
.download::before{content:"";position:absolute;z-index:-1;inset:-100% -60%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 49%,transparent 63%);transform:translateX(-70%);transition:transform 1.3s var(--ease);pointer-events:none}
.download:hover::before,.download:focus-visible::before{transform:translateX(70%)}
@keyframes light-arrive{from{opacity:0}to{opacity:.95}}
@media(prefers-reduced-motion:reduce){#atmosphere{animation:none}}
</style>
</head>
<body>
<div class="page">
<canvas id="atmosphere" aria-hidden="true"></canvas>
<header class="reveal"><p class="wordmark"><svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18M5.5 9.5h13" stroke="currentColor" stroke-width="1.25"/></svg>Find Jesus.</p></header>
<main>
<div class="orbit" aria-hidden="true"></div>
<p class="kicker reveal" style="--order:1">Two minutes a day</p>
<h1 class="reveal" style="--order:2"><span class="first">Find <em>Him</em></span><span class="second">every day.</span></h1>
<p class="subline reveal" style="--order:3">A verse, a hidden figure, and three small games.</p>
<div class="cta reveal" style="--order:4">
<a class="download" href="https://apps.apple.com/us/app/id6807205902"><span class="label"><span>Download on the App Store</span><span aria-hidden="true">Download on the App Store</span></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
<p class="note">Free<span aria-hidden="true">·</span>iPhone<span aria-hidden="true">·</span>No account needed</p>
</div>
<!-- Add the owner's actual app screenshot here when supplied. -->
</main>
<footer class="reveal" style="--order:5"><p>© 2026 Jesus Group LLC<span class="dot">·</span><a href="https://privacy.findjesusapp.com">Privacy</a><span class="dot">·</span><a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Terms</a></p></footer>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('atmosphere');
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const fine = matchMedia('(hover: hover) and (pointer: fine)');
  const button = document.querySelector('.download');
  let width = 0, height = 0, pixelRatio = 1, frame = 0, last = 0, time = 0;
  let targetX = 0, targetY = 0, x = 0, y = 0, energy = 0, targetEnergy = 0;
  const tau = Math.PI * 2;

  function glow(cx, cy, rx, ry, strength) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx, ry);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(197,163,74,${strength})`);
    g.addColorStop(.36, `rgba(155,122,54,${strength * .46})`);
    g.addColorStop(1, 'rgba(155,122,54,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
  }

  function paint(t) {
    ctx.clearRect(0, 0, width, height);
    const size = Math.min(width, height);
    const breath = Math.sin(t * .48);
    const cx = width * .5 + x * size * .045;
    const cy = height * .46 + y * size * .04;
    const radius = Math.min(width * .57, height * .47);
    ctx.globalCompositeOperation = 'screen';
    // Broad, overlapping light fields create depth without particle clutter.
    glow(width * (.28 + x * .13) + Math.sin(t * .19) * size * .07,
      height * (.43 + y * .12), size * .72, size * .54, .12 + breath * .022 + energy * .035);
    glow(width * (.73 - x * .08), height * (.61 - y * .08) + Math.cos(t * .16) * size * .06,
      size * .59, size * .65, .075 - breath * .016);
    glow(cx + Math.cos(t * .12) * radius * .77,
      cy + Math.sin(t * .12) * radius * .62, size * .24, size * .36, .07 + energy * .025);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-.30 + Math.sin(t * .11) * .1 + x * .045);
    // A band of fine, irregular contours behaves like light across brushed metal.
    for (let band = 0; band < 30; band++) {
      const depth = band / 29;
      const r = radius * (.91 + depth * .20 + breath * .013);
      const tilt = .77 + Math.sin(t * .14 + depth) * .025;
      const g = ctx.createLinearGradient(-r, -r, r, r);
      const alpha = (.025 + Math.pow(Math.sin(depth * Math.PI), 2) * .065) * (1 + energy * .35);
      g.addColorStop(0, `rgba(223,203,150,${alpha * 1.55})`);
      g.addColorStop(.22, `rgba(197,163,74,${alpha})`);
      g.addColorStop(.44, 'rgba(197,163,74,0)');
      g.addColorStop(.64, `rgba(197,163,74,${alpha * .20})`);
      g.addColorStop(.82, `rgba(224,205,157,${alpha * 1.2})`);
      g.addColorStop(1, 'rgba(197,163,74,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = band % 7 === 0 ? .85 : .48;
      ctx.beginPath();
      for (let point = 0; point <= 144; point++) {
        const a = point / 144 * tau;
        const wave = Math.sin(a * 3 + t * .26 + depth * 2.4) * (.016 + depth * .012)
          + Math.cos(a * 2 - t * .18) * .018;
        const px = Math.cos(a) * r * (1 + wave);
        const py = Math.sin(a) * r * tilt * (1 + wave) + Math.cos(a * 2 + t * .22) * depth * 9;
        if (point === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function tick(now) {
    frame = 0;
    if (document.hidden || reduced.matches) return;
    const dt = last ? Math.min((now - last) / 1000, .05) : 1 / 60;
    last = now;
    time += dt;
    // Frame-rate-independent easing: light trails the gesture, then settles.
    const follow = 1 - Math.exp(-dt * 2.3);
    x += (targetX - x) * follow;
    y += (targetY - y) * follow;
    energy += (targetEnergy - energy) * (1 - Math.exp(-dt * 2));
    paint(time);
    frame = requestAnimationFrame(tick);
  }
  function start() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    last = 0;
    if (reduced.matches) {
      x = y = energy = 0;
      paint(0);
    } else if (!document.hidden) frame = requestAnimationFrame(tick);
  }
  function resize() {
    width = innerWidth;
    height = innerHeight;
    pixelRatio = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    if (reduced.matches || !frame) paint(reduced.matches ? 0 : time);
  }
  function reset() { targetX = targetY = targetEnergy = 0; }
  window.addEventListener('pointermove', event => {
    if (!fine.matches || reduced.matches || event.pointerType === 'touch') return;
    targetX = Math.max(-1, Math.min(1, event.clientX / width * 2 - 1));
    targetY = Math.max(-1, Math.min(1, event.clientY / height * 2 - 1));
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', reset);
  window.addEventListener('blur', reset);
  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', start);
  reduced.addEventListener('change', start);
  fine.addEventListener('change', reset);
  button.addEventListener('pointerenter', () => { targetEnergy = 1; });
  button.addEventListener('pointerleave', () => { targetEnergy = 0; });
  button.addEventListener('focus', () => { targetEnergy = 1; });
  button.addEventListener('blur', () => { targetEnergy = 0; });
  resize();
  start();
})();
</script>

</body>
</html>
